<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off the chart · Six-Day Forecast</title>
<style>
  :root { --paper: #F2EEE3; --ink: #132230; --ink-3: #66717C; --sea: #2267A6; --pennant: #C8451D; --rule: #CFC7B4; }
  @media (prefers-color-scheme: dark) { :root { --paper: #0F1A24; --ink: #E9E5DA; --ink-3: #8C99A4; --sea: #3F8ED4; --pennant: #D9612B; --rule: #2A3A48; } }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: "Helvetica Neue", Arial, sans-serif; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  main { max-width: 520px; }
  .flags { display: flex; gap: 8px; margin-bottom: 22px; }
  .k { font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--pennant); border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 6px 0; margin-bottom: 18px; }
  h1 { font-size: 46px; line-height: .95; margin: 0 0 14px; text-transform: uppercase; letter-spacing: -.01em; }
  p { font-size: 17px; line-height: 1.5; color: var(--ink); }
  a { color: var(--sea); }
</style>
</head>
<body>
<main>
  <div class="flags" aria-hidden="true">
    <svg width="42" height="28" viewBox="0 0 42 28"><rect x=".5" y=".5" width="41" height="27" fill="#FBF9F3" stroke="#132230"/><rect x="14" y="9.3" width="14" height="9.3" fill="#2267A6"/></svg>
    <svg width="42" height="28" viewBox="0 0 42 28"><rect x=".5" y=".5" width="41" height="27" fill="#E2B23E" stroke="#132230"/><rect x="1" y="7" width="40" height="14" fill="#2267A6"/></svg>
    <svg width="42" height="28" viewBox="0 0 42 28"><rect x=".5" y=".5" width="41" height="27" fill="#FBF9F3" stroke="#132230"/><path d="M21 1 41 14 21 27 1 14Z" fill="#C8451D"/></svg>
  </div>
  <div class="k">404 · Position unknown</div>
  <h1>Off the chart</h1>
  <p>That page is not in the packet. The Monday packet, the verification and the rest are back at <a href="./">the Six-Day Forecast</a>.</p>
</main>
</body>
</html>
